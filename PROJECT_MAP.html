  const structuralIndex=JSON.parse(document.getElementById("project-map-index").textContent);
  function structuralEntries(data){
    const entries=[{id:data.root.id,path:data.root.path,kind:"root",cluster:null}];
    data.clusters.forEach(cluster=>{
      entries.push({id:cluster.id,path:null,kind:"cluster",cluster:null});
      cluster.nodes.forEach(node=>entries.push({id:node.id,path:node.path,kind:"node",cluster:cluster.id}));
    });
    return entries;
  }
  const liveEntries=structuralEntries(PROJECT_MAP_DATA),indexEntries=structuralEntries(structuralIndex);
  const livePairs=new Map(liveEntries.map(entry=>[entry.id,JSON.stringify(entry)]));
  const indexPairs=new Map(indexEntries.map(entry=>[entry.id,JSON.stringify(entry)]));
  const parityIds=new Set([...livePairs.keys(),...indexPairs.keys()]);
  if(livePairs.size!==liveEntries.length||indexPairs.size!==indexEntries.length||[...parityIds].some(id=>livePairs.get(id)!==indexPairs.get(id)))throw new Error("Embedded Project Map index is out of parity with the interactive snapshot");
  const all=[PROJECT_MAP_DATA.root,...PROJECT_MAP_DATA.clusters.flatMap(cluster=>cluster.nodes)],byId=new Map(all.map(node=>[node.id,node]));let selected=PROJECT_MAP_DATA.root.id;

  function list(id,values){const element=document.getElementById(id);element.replaceChildren();values.forEach(value=>{const item=document.createElement("li");item.textContent=value;element.append(item)})}
  function show(id){const node=byId.get(id)||PROJECT_MAP_DATA.root;selected=node.id;document.querySelectorAll("[data-node-id]").forEach(control=>control.setAttribute("aria-current",String(control.dataset.nodeId===node.id)));document.getElementById("detail-kind").textContent=`${node.kind} · ${node.authority}`;document.getElementById("detail-title").textContent=node.label;document.getElementById("detail-path").textContent=node.path;document.getElementById("detail-summary").textContent=node.summary;list("detail-responsibilities",node.responsibilities);list("detail-boundaries",node.boundaries);list("detail-use",node.useWhen||[]);list("detail-routes",node.routes);const open=document.getElementById("open");open.hidden=!safeHref(node.path);if(!open.hidden)open.href=node.path}
  function render(){const tree=document.getElementById("tree");tree.replaceChildren(button(PROJECT_MAP_DATA.root,"root"));PROJECT_MAP_DATA.clusters.forEach(cluster=>{const section=document.createElement("section");section.className="cluster";const heading=document.createElement("h2");heading.textContent=cluster.label;const nodes=document.createElement("div");nodes.className="cluster-list";cluster.nodes.forEach(node=>nodes.append(button(node,"node")));section.append(heading,nodes);tree.append(section)});show(PROJECT_MAP_DATA.root.id)}
  function filter(){const query=document.getElementById("search").value.trim().toLowerCase();document.querySelectorAll("[data-node-id]").forEach(control=>{const node=byId.get(control.dataset.nodeId);const text=[node.label,node.path,node.summary,...node.responsibilities,...node.boundaries,...(node.useWhen||[]),...(node.tags||[])].join(" ").toLowerCase();control.classList.toggle("hidden",Boolean(query)&&!text.includes(query))});document.querySelectorAll(".cluster").forEach(cluster=>cluster.classList.toggle("hidden",![...cluster.querySelectorAll(".node")].some(node=>!node.classList.contains("hidden"))))}
  render();const search=document.getElementById("search");search.addEventListener("input",filter);document.addEventListener("keydown",event=>{if(event.key==="/"&&!/^(INPUT|TEXTAREA)$/.test(document.activeElement?.tagName)){event.preventDefault();search.focus()}else if(event.key==="Escape"){search.value="";filter();search.focus()}});
